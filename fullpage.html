<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>КЭШ.СТРИМ — Рабочий стол</title>
  <link rel="stylesheet" href="win95.css">
  <link rel="stylesheet" href="fullpage.css">
</head>
<body>

  <div class="desktop" id="desktopRoot">

    <!-- Панель управления: всегда на виду, не закрывается -->
    <div class="win95-window panel-window">
      <div class="win95-titlebar">
        <span>🖥️ Панель управления — КЭШ.СТРИМ</span>
        <div class="dots"><span>_</span><span>▢</span><span>×</span></div>
      </div>
      <div class="win95-body panel-body">
        <div class="cash-ticker">💰 <span id="cashValue">0</span><span class="cursor-blink">_</span></div>
        <div class="panel-badge bevel-out">Уровень <span id="levelValue">1</span></div>
        <div class="panel-badge bevel-out">XP <span id="xpValue">0</span>/<span id="xpNeedValue">100</span></div>

        <div class="panel-gauge">
          <label>Фокус</label>
          <div class="win95-gauge focus"><i id="focusFill" style="width:100%"></i><span class="gauge-label" id="focusLabel">100</span></div>
        </div>
        <div class="panel-gauge">
          <label>Выгорание</label>
          <div class="win95-gauge burnout"><i id="burnoutFill" style="width:0%"></i><span class="gauge-label" id="burnoutLabel">0</span></div>
        </div>
        <div class="panel-gauge">
          <label>Аренда через <span id="rentCountdown">30</span>с</label>
          <div class="win95-gauge rent"><i id="rentFill" style="width:0%"></i><span class="gauge-label" id="rentLabel">0💰</span></div>
        </div>

        <div class="panel-badge bevel-out debt-badge" id="debtBadge" hidden>⚠️ Долг: <span id="debtValue">0</span>💰</div>
        <div class="panel-badge bevel-out combo-badge">🔥 Комбо x<span id="comboValue">1.0</span></div>
      </div>
    </div>

    <!-- Иконки рабочего стола: программы открываются двойным кликом -->
    <div class="desktop-icons" id="desktopIcons">
      <button class="desktop-icon" data-window="quests">
        <span class="icon-glyph">📋</span><span class="icon-label">Задачи.exe</span>
      </button>
      <button class="desktop-icon" data-window="work">
        <span class="icon-glyph">💻</span><span class="icon-label">Работа.exe</span>
      </button>
      <button class="desktop-icon" data-window="casino">
        <span class="icon-glyph">🎰</span><span class="icon-label">Перерыв.exe</span>
      </button>
      <button class="desktop-icon" data-window="invest">
        <span class="icon-glyph">📈</span><span class="icon-label">Инвестиции.exe</span>
      </button>
      <button class="desktop-icon" data-window="bank">
  <span class="icon-glyph">🏦</span><span class="icon-label">Банк.exe</span>
</button>
      <div class="desktop-hint">Дважды кликните по значку, чтобы запустить программу</div>
    </div>

    <!-- Сюда JS монтирует плавающие окна -->
    <div class="window-layer" id="windowLayer"></div>

  </div>

  <div class="win95-taskbar">
    <button class="win95-btn bevel-out start-btn">🪟 СТАРТ</button>
    <div class="taskbar-sep"></div>
    <span class="taskbar-app bevel-out">💼 КЭШ.СТРИМ.exe</span>
    <div class="taskbar-sep"></div>
    <div class="taskbar-windows" id="taskbarWindows"></div>
    <div class="tray">
      <span title="Сегодня заработано">📈 <span id="todayCash">0</span></span>
      <span title="Квестов завершено">✅ <span id="todayChains">0</span></span>
      <span id="clock">00:00</span>
    </div>
  </div>

  <!-- Шаблоны содержимого окон (клонируются при первом открытии) -->
  <template id="tpl-quests">
    <div class="win95-body">
      <div class="quest-title" id="questTitle">Загрузка…</div>
      <ol class="quest-steps" id="questStepsList"></ol>
      <div class="quest-current bevel-in">
        <div class="quest-current-text" id="questStepText">—</div>
        <div class="win95-gauge quest"><i id="questFill" style="width:0%"></i><span class="gauge-label" id="questLabel">0/0</span></div>
      </div>

      <div class="intern-box bevel-in">
        <div class="intern-title">🧑‍💼 Стажёры (авто-клики)</div>
        <div class="intern-stats">Нанято: <span id="internCount">0</span> · Доход: <span id="internIncome">0</span>💰/с</div>
        <button id="hireIntern" class="win95-btn bevel-out">Нанять за <span id="internCost">400</span>💰</button>
      </div>

      <div class="intern-box bevel-in">
        <div class="intern-title">🛠️ Апгрейды рабочего места</div>
        <div class="intern-stats">Оборудование ур. <span id="equipLevel">0</span> · клик +<span id="equipBonus">0</span></div>
        <button id="buyEquip" class="win95-btn bevel-out">Улучшить за <span id="equipCost">260</span>💰</button>
        <div class="intern-stats" style="margin-top:6px;">Кофемашина ур. <span id="coffeeLevel">0</span> · фокус дешевле</div>
        <button id="buyCoffee" class="win95-btn bevel-out">Купить за <span id="coffeeCost">220</span>💰</button>
      </div>

      <div class="history-title">🗂️ Журнал событий</div>
      <div class="history-log bevel-in" id="historyLog"></div>
    </div>
  </template>

  <template id="tpl-work">
    <div class="win95-body work-body">
      <div class="work-instruction" id="workInstruction">—</div>
      <div class="work-zone bevel-in" id="workZone"></div>
      <div class="work-hint" id="workHint"></div>
    </div>
  </template>

  <template id="tpl-casino">
    <div class="win95-body casino-body">
      <iframe id="casinoFrame" src="casino.html" class="program-frame"></iframe>
    </div>
  </template>

  <template id="tpl-invest">
    <div class="win95-body invest-body">
      <iframe id="investFrame" src="invest.html" class="program-frame"></iframe>
    </div>
</template>

<template id="tpl-bank">
  <div class="win95-body bank-body">
    <iframe id="bankFrame" src="bank.html" class="program-frame"></iframe>
  </div>
</template>

  <script src="shared.js"></script>
  <script src="fullpage.js"></script>
</body>
</html>
